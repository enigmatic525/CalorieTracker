
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MacroFactor</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neutral: {
                            850: '#1f1f1f',
                            900: '#171717',
                            950: '#0a0a0a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            font-size: 14px;
            font-weight: 400;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        input[type="number"] { 
            cursor: text !important; 
            -webkit-user-select: text !important;
            user-select: text !important;
        }
        * { letter-spacing: 0px !important; }
        
        .tab-active {
            color: #d4d4d4; 
            border-bottom: 2px solid #d4d4d4;
        }
        .tab-inactive {
            color: #737373;
            border-bottom: 2px solid transparent;
        }
        .tab-inactive:hover { color: #a3a3a3; }
    </style>
</head>
<body class="bg-neutral-950 text-neutral-300 pb-24 selection:bg-neutral-300/30">
    <div id="app" class="max-w-md mx-auto px-4 pt-6 pb-8 space-y-8">
        
        <!-- Goal Modal -->
        <div id="goal-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
            <div class="bg-neutral-900 border border-neutral-800 p-6 rounded-xl w-full max-w-sm shadow-2xl">
                <h3 class="text-lg mb-4 text-neutral-300">Set Daily Goal</h3>
                <input id="goal-input" type="number" class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-3 text-neutral-300 mb-6 outline-none focus:ring-2 focus:ring-neutral-300 placeholder-neutral-500" placeholder="e.g. 2000">
                <div class="flex gap-3">
                    <button onclick="closeGoalModal()" class="flex-1 py-3 rounded-lg text-neutral-400 hover:bg-neutral-800 transition-colors">Cancel</button>
                    <button onclick="saveGoalFromModal()" class="flex-1 py-3 rounded-lg bg-neutral-300 text-black hover:bg-neutral-400 transition-colors">Save</button>
                </div>
            </div>
        </div>

        <!-- Dashboard Header -->
        <header class="bg-neutral-900 p-6 rounded-xl border border-neutral-800 shadow-xl space-y-6 text-center">
            <div>
                <div class="text-neutral-500 text-xs uppercase tracking-widest mb-2">Total Calories</div>
                <div class="text-neutral-300 text-6xl leading-none" id="total-display">0</div>
            </div>

            <!-- Goal Progress Section -->
            <div class="space-y-2">
                <div class="flex justify-between items-end">
                    <span id="percent-display" class="text-xs text-neutral-500">0%</span>
                    <button onclick="editGoal()" class="text-xs text-neutral-300 hover:text-neutral-400 uppercase tracking-widest transition-colors cursor-pointer outline-none">
                        Goal: <span id="goal-display">2000</span>
                    </button>
                </div>
                <div class="w-full bg-neutral-800 rounded-full h-3 overflow-hidden">
                    <div id="progress-bar" class="bg-neutral-300 h-full rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                </div>
            </div>
        </header>

        <!-- Controls -->
        <section class="space-y-4">
            <div class="grid grid-cols-3 gap-3">
                <button onclick="addCalories(50)" class="bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 text-neutral-300 py-4 rounded-xl transition-colors text-lg active:scale-95">
                    +50
                </button>
                <button onclick="addCalories(100)" class="bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 text-neutral-300 py-4 rounded-xl transition-colors text-lg active:scale-95">
                    +100
                </button>
                <button onclick="addCalories(500)" class="bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 text-neutral-300 py-4 rounded-xl transition-colors text-lg active:scale-95">
                    +500
                </button>
            </div>

            <form onsubmit="addCustomCalories(event)" class="flex gap-3">
                <input 
                    id="custom-input" 
                    type="number" 
                    inputmode="numeric" 
                    placeholder="Custom amount..." 
                    class="flex-1 bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-4 text-neutral-300 outline-none focus:border-neutral-300/50 transition-colors placeholder-neutral-600"
                >
                <button type="submit" class="bg-neutral-300 hover:bg-neutral-400 text-black px-6 rounded-xl transition-colors font-bold active:scale-95">
                    Add
                </button>
            </form>
        </section>

        <!-- Daily Log -->
        <section class="bg-neutral-900 rounded-xl border border-neutral-800 overflow-hidden shadow-lg">
            <div class="p-4 border-b border-neutral-800 bg-neutral-900/50">
                <h2 class="text-neutral-500 uppercase tracking-widest text-xs">Today's Log</h2>
            </div>
            <div id="log-container" class="divide-y divide-neutral-800 max-h-[400px] overflow-y-auto no-scrollbar">
                <!-- Entries injected here -->
            </div>
        </section>
    </div>

    <script>
        let dailyLog = [];
        let dailyGoal = 2000;
        let lastResetDate = "";

        const elements = {
            totalDisplay: document.getElementById('total-display'),
            log: document.getElementById('log-container'),
            goalDisplay: document.getElementById('goal-display'),
            progressBar: document.getElementById('progress-bar'),
            percentDisplay: document.getElementById('percent-display'),
            goalModal: document.getElementById('goal-modal'),
            goalInput: document.getElementById('goal-input'),
            customInput: document.getElementById('custom-input')
        };

        function init() {
            const data = JSON.parse(localStorage.getItem('macrofactor_tally_data') || '{"log":[],"goal":2000,"lastResetDate":""}');
            const today = new Date().toDateString();

            if (data.lastResetDate !== today) {
                dailyLog = [];
                lastResetDate = today;
                saveData();
            } else {
                dailyLog = data.log || [];
                lastResetDate = data.lastResetDate;
            }

            dailyGoal = data.goal || 2000;
            render();
        }

        function addCalories(amount) {
            const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            dailyLog.unshift({ id: Date.now(), amount: amount, time: timeString });
            saveAndRender();
        }

        function addCustomCalories(e) {
            e.preventDefault();
            const val = parseInt(elements.customInput.value);
            if (!isNaN(val) && val > 0) {
                addCalories(val);
                elements.customInput.value = '';
                elements.customInput.blur();
            }
        }

        function deleteEntry(id) {
            dailyLog = dailyLog.filter(item => item.id !== id);
            saveAndRender();
        }

        function editGoal() {
            elements.goalModal.classList.remove('hidden');
            elements.goalInput.value = dailyGoal;
            setTimeout(() => elements.goalInput.focus(), 100);
        }

        function closeGoalModal() {
            elements.goalModal.classList.add('hidden');
        }

        function saveGoalFromModal() {
            const newGoal = parseInt(elements.goalInput.value);
            if (!isNaN(newGoal) && newGoal > 0) {
                dailyGoal = newGoal;
                saveAndRender();
                closeGoalModal();
            }
        }

        function saveData() {
            localStorage.setItem('macrofactor_tally_data', JSON.stringify({ 
                log: dailyLog, 
                goal: dailyGoal,
                lastResetDate: lastResetDate 
            }));
        }

        function saveAndRender() {
            saveData();
            render();
        }

        function render() {
            const total = dailyLog.reduce((sum, item) => sum + item.amount, 0);
            
            elements.totalDisplay.textContent = total;
            elements.goalDisplay.textContent = dailyGoal;
            
            const percent = Math.min((total / dailyGoal) * 100, 100);
            elements.progressBar.style.width = `${percent}%`;
            elements.percentDisplay.textContent = `${Math.round(percent)}%`;

            if (dailyLog.length === 0) {
                elements.log.innerHTML = `<div class="p-6 text-center text-neutral-600">No entries yet</div>`;
                return;
            }

            elements.log.innerHTML = dailyLog.map(item => `
                <div class="p-4 flex items-center justify-between hover:bg-neutral-800/50 transition-colors">
                    <div>
                        <div class="text-neutral-300">+${item.amount} kcal</div>
                        <div class="text-neutral-500 text-xs mt-1">${item.time}</div>
                    </div>
                    <button onclick="deleteEntry(${item.id})" class="p-2 text-neutral-600 hover:text-rose-400 min-h-[44px] min-w-[44px] flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
            `).join('');
        }

        elements.goalInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') saveGoalFromModal();
        });

        init();
    </script>
</body>
</html>
